    <!-- an iphone home-screen app gets its own empty storage, so the install
         carries the member's token in start_url. otherwise opening the new icon
         logs you out. -->
    <script>
      (function () {
        var t = null
        try { t = new URLSearchParams(location.search).get("t") || localStorage.getItem("irlpass_member_token") } catch (e) {}
        var l = document.createElement("link")
        l.rel = "manifest"
        l.href = t && /^[A-Za-z0-9]{16,64}$/.test(t) ? "/api/manifest?t=" + t : "/manifest.webmanifest"
        document.head.appendChild(l)
      })()
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
